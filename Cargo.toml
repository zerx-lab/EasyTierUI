[package]
name = "nsh-app-easytierui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Panic-free, unsafe-free Rust (AGENTS.md "Rust safety"). `clippy.toml` lets
# test code panic; `cargo clippy --all-targets -- -D warnings` turns every
# "warn" below into an error, so warn only marks lints that need judgment
# while iterating.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# No panic paths outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
exit = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Failures are handled or logged through `log`, never printed or dropped.
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "warn"
# Suppressions say why.
allow_attributes_without_reason = "deny"

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.3.0"
nsh-testing = "0.3.0"
