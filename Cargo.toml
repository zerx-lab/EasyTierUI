[package]
name = "nsh-app-easytierui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
# Bridges with their own lint tables: the EasyTier library for the mobile builds (UniFFI generates `unsafe`), and the
# desktops' tray / window / login-item integration NSH has no API for (AppKit and Win32 calls, the user's decision).
members = ["crates/easytier-mobile", "crates/desktop-shell"]

# Panic-free, unsafe-free Rust (AGENTS.md "Rust safety"). `clippy.toml` lets
# test code panic; `cargo clippy --all-targets -- -D warnings` turns every
# "warn" below into an error, so warn only marks lints that need judgment
# while iterating.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# No panic paths outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
exit = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Failures are handled or logged through `log`, never printed or dropped.
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "warn"
# Suppressions say why.
allow_attributes_without_reason = "deny"

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
log = "0.4"
# Errors the UI can match on (AGENTS.md "Code conventions").
thiserror = "2"
# EasyTier's config file, CLI JSON and easytier-web's REST bodies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Peer / listener URLs and CIDRs from untrusted input.
url = "2.5"
ipnet = { version = "2", features = ["serde"] }
# Release digests (sha256) and easytier-web's login pre-hash (MD5, what its frontend sends).
sha2 = "0.10"
md-5 = "0.10"
# Generated secrets and share links.
base64 = "0.22"
# Secrets are wiped from memory when dropped.
zeroize = "1"
uuid = { version = "1", features = ["serde"] }
# Share-link QR codes: encodes text to a module matrix (pure Rust, no dependencies).
qrcodegen = "1"
# Reads a QR code from picked image pixels; `default-features = false` drops its `image` crate integration.
rqrr = { version = "0.10", default-features = false }
# Decodes picked PNG screenshots of a QR code (already in the tree through NSH's image support); also renders test images.
png = "0.18"
# Decodes picked JPEG photos of a QR code; no SIMD feature, so the untrusted-input decoder stays in safe Rust.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
# The user's preferred UI language: NSH's `locale()` is the region format, which a packaged macOS / iOS app
# without zh localizations resolves to `en_CN` even when the system language is Chinese.
sys-locale = "0.3"

# The desktops run EasyTier's official programs: data directory, release zips, the OS keychain, and the
# administrator prompt that installs a TUN node as an OS service.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The tray icon, closing to the tray, starting hidden, one instance, the login item (AGENTS.md "Desktop shell").
desktop-shell = { path = "crates/desktop-shell" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
dirs = "6"
keyring = { version = "3", features = ["apple-native"] }

# iOS / Android run EasyTier's library in process (a platform constraint, AGENTS.md "Mobile is the exception"):
# the bridge crate links it from git; desktops never compile it.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
easytier-mobile = { path = "crates/easytier-mobile" }

[dev-dependencies]
# `net`: the engine's real HTTP stack, for the ignored smoke that drives a loopback easytier-web (tests/app/smoke.rs).
nsh-engine = { version = "0.3.0", features = ["net"] }
nsh-testing = "0.3.0"
